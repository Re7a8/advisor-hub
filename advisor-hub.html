<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisor Hub</title>
<style>
  :root{
    --bg:#F5F6F8;
    --panel:#FFFFFF;
    --ink:#171A21;
    --muted:#6B7280;
    --border:#E4E7EC;
    --accent:#0E7C86;
    --accent-soft:#E3F3F3;
    --user-bubble:#171A21;
    --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    height:100vh;
    max-width:1100px;
    margin:0 auto;
    background:var(--panel);
    box-shadow:0 0 40px rgba(20,20,30,0.06);
    overflow:hidden;
    position:relative;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    background:var(--panel);
  }
  .sidebar-head{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-head h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .sidebar-head p{
    margin:4px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }
  .role-list{
    flex:1;
    overflow-y:auto;
    padding:10px 10px 20px;
  }
  .category-label{
    font-size:11.5px;
    color:var(--muted);
    font-weight:600;
    margin:16px 10px 6px;
  }
  .category-label:first-child{margin-top:6px;}
  .role-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    padding:9px 10px;
    border:none;
    background:transparent;
    border-radius:10px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .role-item:hover{background:#F2F3F5;}
  .role-item.active{
    background:var(--accent);
    color:#fff;
  }
  .role-item.active .role-sub{color:rgba(255,255,255,0.75);}
  .avatar{
    width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;
    flex-shrink:0;
  }
  .role-text{min-width:0;}
  .role-name{font-weight:600;line-height:1.25;}
  .role-sub{
    font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.3;
  }

  /* ---------- Chat area ---------- */
  .chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .chat-header{
    padding:16px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .menu-btn{
    display:none;
    border:none;background:none;cursor:pointer;
    width:34px;height:34px;border-radius:8px;
    align-items:center;justify-content:center;
    color:var(--ink);
  }
  .menu-btn:hover{background:#F2F3F5;}
  .chat-header-text h2{
    margin:0;font-size:16px;font-weight:700;
  }
  .chat-header-text p{
    margin:2px 0 0;font-size:12.5px;color:var(--muted);
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:78%;
    padding:11px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    animation:rise 0.18s ease-out;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(4px);}
    to{opacity:1;transform:translateY(0);}
  }
  .msg.assistant{
    align-self:flex-start;
    background:#F7F8FA;
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.error{
    align-self:flex-start;
    background:#FBEAEA;
    border:1px solid #F1C7C4;
    color:var(--danger);
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:13px 16px;
    background:#F7F8FA;
    border:1px solid var(--border);
    border-radius:14px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  .composer{
    padding:16px 22px 20px;
    border-top:1px solid var(--border);
  }
  .composer-bar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    border-radius:26px;
    padding:6px 8px 6px 16px;
  }
  .composer-bar input{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    color:#fff;
    font-size:14.5px;
    padding:9px 0;
  }
  .composer-bar input::placeholder{color:rgba(255,255,255,0.45);}
  .icon-btn{
    border:none;background:none;color:rgba(255,255,255,0.55);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:default;
    flex-shrink:0;
  }
  .send-btn{
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  .send-btn:hover{background:#0B646C;}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .backdrop{
    display:none;
    position:absolute;inset:0;
    background:rgba(10,10,15,0.35);
    z-index:5;
  }

  @media (max-width:760px){
    .app{max-width:100%;height:100dvh;}
    .sidebar{
      position:absolute;
      left:0;top:0;bottom:0;
      transform:translateX(-100%);
      transition:transform 0.22s ease;
      z-index:10;
      box-shadow:2px 0 24px rgba(0,0,0,0.12);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:flex;}
    .backdrop.show{display:block;}
    .msg{max-width:88%;}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h1>Advisor Hub</h1>
      <p>Pick a role, ask it anything</p>
    </div>
    <div class="role-list" id="roleList"></div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="chat">
    <div class="chat-header">
      <button class="menu-btn" id="menuBtn" aria-label="Open roles">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="chat-header-text">
        <h2 id="chatTitle"></h2>
        <p id="chatSubtitle"></p>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-bar">
        <button class="icon-btn" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="9.5" r="1" fill="currentColor"/><circle cx="15" cy="9.5" r="1" fill="currentColor"/></svg>
        </button>
        <input id="msgInput" type="text" placeholder="Ask your advisor..." autocomplete="off">
        <button class="icon-btn" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 15V6a2 2 0 00-2-2H8.5L6 7H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="icon-btn send-btn" id="sendBtn" aria-label="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 20l16-8L4 4l2 7.2L15 12l-9 .8L4 20z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
const CATEGORY_COLORS = {
  "Design & mechanical": "#0E7C86",
  "Electrical & mechatronics": "#B45309",
  "Software & AI": "#4338CA",
  "Communications & networks": "#BE123C",
  "Other disciplines": "#475569"
};

const ROLES = [
  {id:"mech-design", name:"Mechanical Design Engineer", category:"Design & mechanical",
   tools:"SolidWorks, Inventor, CATIA, AutoCAD, PLM systems",
   focus:"part and assembly design, GD&T, DFM/DFA, stress/CFD/thermal simulation"},
  {id:"manufacturing", name:"Manufacturing / Process Engineer", category:"Design & mechanical",
   tools:"Mastercam, Fusion 360 CAM, Lean/Six Sigma tools",
   focus:"process planning, tooling, cycle time, yield improvement"},
  {id:"quality", name:"Quality Engineer", category:"Design & mechanical",
   tools:"GD&T, CMM software, SPC, Minitab",
   focus:"inspection plans, root cause analysis (8D, FMEA), APQP/PPAP"},
  {id:"automotive", name:"Automotive Engineer", category:"Design & mechanical",
   tools:"CATIA, MATLAB/Simulink, ADAMS, GT-Power",
   focus:"powertrain, chassis, NVH, vehicle dynamics"},
  {id:"aerospace", name:"Aerospace Engineer", category:"Design & mechanical",
   tools:"CATIA, NASTRAN/Patran, ANSYS",
   focus:"aerodynamics, structures, propulsion, avionics integration"},

  {id:"electrical-power", name:"Electrical Engineer (Power)", category:"Electrical & mechatronics",
   tools:"ETAP, AutoCAD Electrical, PSCAD, SKM",
   focus:"power distribution, protection schemes, load calculations, single-line diagrams"},
  {id:"electronics-pcb", name:"Electronics / PCB Design Engineer", category:"Electrical & mechatronics",
   tools:"Altium Designer, KiCad, OrCAD",
   focus:"schematic capture, PCB layout, signal integrity, EMC/EMI"},
  {id:"embedded", name:"Embedded Systems Engineer", category:"Electrical & mechatronics",
   tools:"Keil, STM32CubeIDE, PlatformIO, JTAG debuggers, C/C++",
   focus:"firmware, RTOS, microcontrollers, low-level drivers"},
  {id:"mechatronics", name:"Mechatronics Engineer", category:"Electrical & mechatronics",
   tools:"Simulink, LabVIEW, ROS, SolidWorks with control co-simulation",
   focus:"sensor/actuator integration, motion control, robotic subsystems"},
  {id:"controls", name:"Control Systems Engineer", category:"Electrical & mechatronics",
   tools:"MATLAB/Simulink, PLC programming (TIA Portal, RSLogix), SCADA",
   focus:"PID tuning, feedback loops, industrial automation logic"},
  {id:"robotics", name:"Robotics Engineer", category:"Electrical & mechatronics",
   tools:"ROS/ROS2, Gazebo, MoveIt, Python/C++",
   focus:"kinematics, path planning, manipulation, SLAM"},
  {id:"drone", name:"Drone / UAV Engineer", category:"Electrical & mechatronics",
   tools:"PX4/ArduPilot, Mission Planner, QGroundControl",
   focus:"flight controller tuning, autopilot, airframe design, payload integration"},

  {id:"software", name:"Software Engineer", category:"Software & AI",
   tools:"Git, Docker, CI/CD pipelines, IDEs",
   focus:"architecture, design patterns, testing, code review"},
  {id:"ai-ml", name:"AI / Machine Learning Engineer", category:"Software & AI",
   tools:"PyTorch, TensorFlow, Hugging Face, MLflow",
   focus:"model training, fine-tuning, evaluation, deployment"},
  {id:"data-eng", name:"Data Engineer", category:"Software & AI",
   tools:"Spark, Airflow, dbt, Kafka",
   focus:"pipelines, ETL/ELT, data warehousing"},
  {id:"data-sci", name:"Data Scientist", category:"Software & AI",
   tools:"Python (pandas, scikit-learn), R, Tableau/Power BI",
   focus:"statistical modeling, experimentation, insight generation"},
  {id:"devops", name:"DevOps / Cloud Engineer", category:"Software & AI",
   tools:"AWS/Azure/GCP, Terraform, Kubernetes, Docker",
   focus:"infrastructure as code, CI/CD, monitoring, scaling"},
  {id:"cyber", name:"Cybersecurity Engineer", category:"Software & AI",
   tools:"Wireshark, Metasploit, Burp Suite, Splunk",
   focus:"penetration testing, threat modeling, incident response"},
  {id:"systems", name:"Systems Engineer", category:"Software & AI",
   tools:"DOORS, SysML tools (Cameo, Enterprise Architect)",
   focus:"requirements management, system architecture, verification & validation"},

  {id:"telecom", name:"Telecommunications Engineer", category:"Communications & networks",
   tools:"MATLAB, NS-3, network simulators",
   focus:"RF propagation, modulation, link budgets, 4G/5G"},
  {id:"rf", name:"RF Engineer", category:"Communications & networks",
   tools:"CST Studio, HFSS, ADS",
   focus:"antenna design, impedance matching, electromagnetic simulation"},
  {id:"network", name:"Network Engineer", category:"Communications & networks",
   tools:"Cisco IOS, Wireshark, GNS3/EVE-NG",
   focus:"routing/switching, network design, troubleshooting"},

  {id:"civil", name:"Civil / Structural Engineer", category:"Other disciplines",
   tools:"AutoCAD, Revit, ETABS, SAP2000, STAAD.Pro",
   focus:"structural analysis, load calculations, building codes"},
  {id:"chem", name:"Chemical Process Engineer", category:"Other disciplines",
   tools:"Aspen Plus/HYSYS, P&ID software",
   focus:"process design, mass/energy balances, reactor design"},
  {id:"biomed", name:"Biomedical Engineer", category:"Other disciplines",
   tools:"SolidWorks, MATLAB, LabVIEW",
   focus:"medical device design, biocompatibility, signal processing, regulatory pathways"},
  {id:"hr", name:"HR Expert", category:"Other disciplines",
   tools:"HRIS platforms, ATS systems, compensation frameworks",
   focus:"hiring, performance management, policy, employee relations, compensation"},
  {id:"cv", name:"CV / Resume Expert", category:"Other disciplines",
   tools:"ATS-optimized formatting, LinkedIn",
   focus:"resume structure, wording, tailoring applications to job descriptions"},
];

const conversations = {};
let activeRoleId = ROLES[0].id;

function initials(name){
  return name.split(/[\s/]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function renderSidebar(){
  const list = document.getElementById("roleList");
  list.innerHTML = "";
  let lastCategory = null;
  ROLES.forEach(role=>{
    if(role.category !== lastCategory){
      const label = document.createElement("div");
      label.className = "category-label";
      label.textContent = role.category;
      list.appendChild(label);
      lastCategory = role.category;
    }
    const btn = document.createElement("button");
    btn.className = "role-item" + (role.id===activeRoleId ? " active":"");
    btn.dataset.roleId = role.id;
    btn.innerHTML = `
      <span class="avatar" style="background:${CATEGORY_COLORS[role.category]}">${initials(role.name)}</span>
      <span class="role-text">
        <span class="role-name">${role.name}</span>
        <span class="role-sub">${role.tools}</span>
      </span>`;
    btn.addEventListener("click", ()=>selectRole(role.id));
    list.appendChild(btn);
  });
}

function getRole(id){ return ROLES.find(r=>r.id===id); }

function selectRole(id){
  activeRoleId = id;
  renderSidebar();
  updateHeader();
  renderMessages();
  closeSidebarMobile();
  document.getElementById("msgInput").focus();
}

function updateHeader(){
  const role = getRole(activeRoleId);
  document.getElementById("chatTitle").textContent = role.name + " Advisor";
  document.getElementById("chatSubtitle").textContent = role.focus;
}

function ensureConversation(id){
  if(!conversations[id]){
    const role = getRole(id);
    conversations[id] = [
      {role:"assistant", content:`I'm your ${role.name} advisor. Ask me about ${role.focus}, and I'll answer the way a working ${role.name} would — grounded in real tools and workflows.`, isGreeting:true}
    ];
  }
  return conversations[id];
}

function renderMessages(){
  const el = document.getElementById("messages");
  el.innerHTML = "";
  ensureConversation(activeRoleId).forEach(m=>{
    const div = document.createElement("div");
    div.className = "msg " + (m.role==="user"?"user":(m.error?"error":"assistant"));
    div.textContent = m.content;
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}

function showTyping(){
  const el = document.getElementById("messages");
  const t = document.createElement("div");
  t.className = "typing";
  t.id = "typingIndicator";
  t.innerHTML = "<span></span><span></span><span></span>";
  el.appendChild(t);
  el.scrollTop = el.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById("typingIndicator");
  if(t) t.remove();
}

async function sendMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;
  const role = getRole(activeRoleId);
  const convo = ensureConversation(activeRoleId);

  convo.push({role:"user", content:text});
  input.value = "";
  renderMessages();

  document.getElementById("sendBtn").disabled = true;
  showTyping();

  const systemPrompt = `You are an expert advisor acting as a senior, hands-on ${role.name}. ` +
    `Typical tools of this role: ${role.tools}. Core focus areas: ${role.focus}. ` +
    `Answer the way an experienced ${role.name} would explain things to a colleague: practical, specific, and grounded in real tools and workflows. ` +
    `Keep answers focused and skip generic filler. If a question falls outside this role's expertise, say so briefly and name which advisor role would fit better.`;

  const apiMessages = convo
    .filter(m=>!m.isGreeting)
    .map(m=>({role:m.role, content:m.content}));

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: systemPrompt,
        messages: apiMessages.length ? apiMessages : [{role:"user", content:text}]
      })
    });
    const data = await response.json();
    hideTyping();

    const textBlocks = (data.content || []).filter(b=>b.type==="text").map(b=>b.text);
    const reply = textBlocks.join("\n").trim();

    if(reply){
      convo.push({role:"assistant", content:reply});
    } else {
      convo.push({role:"assistant", content:"I couldn't generate a response just now. Please try asking again.", error:true});
    }
  } catch(err){
    hideTyping();
    convo.push({role:"assistant", content:"Something went wrong reaching the advisor. Please try again.", error:true});
  }

  document.getElementById("sendBtn").disabled = false;
  renderMessages();
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("msgInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") sendMessage();
});

// Mobile sidebar drawer
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
document.getElementById("menuBtn").addEventListener("click", ()=>{
  sidebar.classList.add("open");
  backdrop.classList.add("show");
});
backdrop.addEventListener("click", closeSidebarMobile);
function closeSidebarMobile(){
  sidebar.classList.remove("open");
  backdrop.classList.remove("show");
}

renderSidebar();
updateHeader();
renderMessages();
</script>
</body>
</html>
